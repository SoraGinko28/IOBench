[project]
name = "metasl"
version = "0.1.0"
description = "Single-node FSDP checkpoint IO-trace bench with gdtensor"
requires-python = ">=3.12"
dependencies = ["torch==2.14.0", "transformers==5.17.0", "safetensors==0.8.0", "gdtensor>=0.1.0", "numpy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["checkpoints"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E731"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
